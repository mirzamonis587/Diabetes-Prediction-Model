<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Diabetes Prediction</title>
</head>

<body>
    

<div class="container">
    
    <form action="/predict" method="post" class="form mt-5">
       <div class="headings">
        <h1>Diabetes Prediction Model</h1>
    <h2>Enter Patient Data</h2>
       </div>
        <div class="col g-3 form-box">
            <div class="row form-items">
                <label for="formGroupExampleInput" class="form-label">Pregnancies:</label>
                <input type="number" name="Pregnancies" required placeholder=" ">
            </div>
            <div class="row form-items">
                <label for="formGroupExampleInput" class="form-label">Glucose:</label>
                <input type="number" name="Glucose" required >
            </div>
            <div class="row form-items">
                <label for="formGroupExampleInput" class="form-label">BloodPressure:</label>
                <input type="number" name="BloodPressure" required placeholder=" ">
            </div>
            <div class="row form-items">
                <label for="formGroupExampleInput" class="form-label">SkinThickness:</label>
                <input type="number" name="SkinThickness" required placeholder=" ">
            </div>
            <div class="row form-items">
                <label for="formGroupExampleInput" class="form-label">Insulin:</label>
                <input type="number" name="Insulin" required placeholder=" ">
            </div>
            <div class="row form-items">
                <label for="formGroupExampleInput" class="form-label">BMI:</label>
                <input type="number" name="BMI" required placeholder=" ">
            </div>
            <div class="row form-items">
                <label for="formGroupExampleInput" class="form-label">DiabetesPedigreeFunction:</label>
                <input type="number" name="DiabetesPedigreeFunction" required placeholder=" ">
            </div>
            <div class="row form-items">
                <label for="formGroupExampleInput" class="form-label">Age:</label>
                <input type="number" name="Age" required placeholder=" ">
            </div>


        </div>
        <input class="btn mb-3" type="submit" value="Predict">
    </form>

    <h2>Prediction: {{ <span>prediction_text</span> }}</h2>
    </div>
